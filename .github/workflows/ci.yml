name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend verify
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Shell syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh scripts/tests/fixtures/replica-smoke-bin/*

      - name: Shell tests
        run: scripts/tests/replica-smoke-test.sh

      - name: Compose config
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config >/tmp/mamoji-compose.yml

      - name: Caddy config
        run: >-
          docker run --rm
          -e MAMOJI_PUBLIC_HOST=mamoji.example.com
          -e MAMOJI_TLS_EMAIL=ops@example.com
          -e MAMOJI_MINIO_BUCKET=mamoji
          -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile
