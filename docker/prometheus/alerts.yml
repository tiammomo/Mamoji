groups:
  - name: mamoji.production
    rules:
      - alert: MamojiBackendDown
        expr: up{job="mamoji-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Mamoji backend metrics scrape is down
          description: Prometheus cannot scrape backend /actuator/prometheus for more than 2 minutes.

      - alert: MamojiHighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{job="mamoji-backend",status=~"5.."}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mamoji backend 5xx responses are rising
          description: Backend 5xx responses have stayed above 0.05 requests per second for 5 minutes.

      - alert: MamojiHighHeapUsage
        expr: sum(jvm_memory_used_bytes{job="mamoji-backend",area="heap"}) / sum(jvm_memory_max_bytes{job="mamoji-backend",area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Mamoji backend heap usage is high
          description: JVM heap usage has stayed above 90% for 10 minutes.

      - alert: MamojiDatabasePoolPendingConnections
        expr: max(hikaricp_connections_pending{job="mamoji-backend"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mamoji database pool has pending connections
          description: HikariCP has had pending database connections for more than 5 minutes.

      - alert: MamojiReceiptStorageCapacityWarning
        expr: increase(mamoji_receipt_storage_capacity_warnings_total{job="mamoji-backend"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A company receipt storage allocation reached its warning level
          description: At least one receipt upload crossed the configured company storage warning level in the last 15 minutes.

      - alert: MamojiReceiptStorageQuotaRejected
        expr: increase(mamoji_receipt_storage_capacity_rejections_total{job="mamoji-backend"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A receipt upload was rejected by company storage quota
          description: At least one receipt upload exceeded the configured company storage maximum in the last 15 minutes.

      - alert: MamojiReceiptStorageCompensationFailed
        expr: increase(mamoji_receipt_storage_compensation_total{job="mamoji-backend",outcome="failure"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: An unreferenced receipt object could not be removed
          description: Inspect backend logs for the bucket and object key, then reconcile the unreferenced MinIO object manually.
